<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applyboard — Job Tracker</title><style>
:root{--bg:#f6f7f4;--ink:#18241d;--muted:#758078;--line:#e2e8e2;--green:#356c4b;--pale:#e9f2e8;--white:#fff;--shadow:0 12px 35px #18241d0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}.layout{max-width:1100px;margin:auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-weight:800;font-size:19px;letter-spacing:-.05em}.brand b{color:var(--green)}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:7px;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:white}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat,.board,.panel{background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stat{padding:17px}.stat strong{display:block;font-size:25px;letter-spacing:-.05em}.stat span{color:var(--muted);font-size:11px}.controls{display:flex;justify-content:space-between;gap:10px;margin-bottom:13px}.controls input{width:min(320px,100%)}input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:#fff;color:var(--ink)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:0;overflow:hidden}.lane{padding:13px;border-right:1px solid var(--line);min-height:350px}.lane:last-child{border-right:0}.lane h2{font-size:12px;margin:0 0 12px;display:flex;justify-content:space-between}.lane h2 span{color:var(--muted);font-weight:400}.job{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:9px;background:white}.job h3{font-size:13px;margin:0}.job .company{font-size:11px;color:var(--muted)}.job-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.pill{font-size:9px;border-radius:20px;padding:3px 7px;background:var(--pale);color:var(--green)}.job-actions{display:flex;gap:5px}.small{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:11px}.modal{position:fixed;inset:0;background:#0b1510a6;display:none;place-items:center;padding:18px;z-index:2}.modal.open{display:grid}.form{width:min(470px,100%);background:#fff;border-radius:12px;padding:22px}.form h2{margin:0 0 15px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields label{font-size:11px;color:var(--muted)}.fields input,.fields select,.fields textarea{width:100%;margin-top:4px}.fields .wide{grid-column:span 2}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.empty{font-size:11px;color:#a2aaa4;text-align:center;padding:15px 4px}.note{font-size:10px;color:var(--muted);margin:13px 2px}@media(max-width:740px){.board{grid-template-columns:1fr 1fr}.lane:nth-child(2){border-right:0}.lane:nth-child(-n+2){border-bottom:1px solid var(--line)}.summary{grid-template-columns:1fr 1fr}}@media(max-width:420px){.board{grid-template-columns:1fr}.lane{border-right:0!important;border-bottom:1px solid var(--line);min-height:auto}.controls{flex-direction:column}.summary{gap:7px}.stat{padding:12px}}
</style></head><body><main class="layout"><header class="top"><div><div class="brand">apply<b>board</b></div><div class="muted">A calmer way to manage the search.</div></div><button class="btn primary" id="add">＋ Add application</button></header><section class="summary"><div class="stat"><strong id="total">0</strong><span>Applications</span></div><div class="stat"><strong id="active">0</strong><span>In progress</span></div><div class="stat"><strong id="interviews">0</strong><span>Interviews</span></div><div class="stat"><strong id="response">0%</strong><span>Response rate</span></div></section><div class="controls"><input id="search" placeholder="Search roles or companies…"><button class="btn" id="reset">Reset sample data</button></div><section class="board" id="board"></section><p class="note">Demo uses this browser’s local storage. No account or server is connected.</p></main><div class="modal" id="modal"><form class="form" id="form"><h2 id="form-title">Add application</h2><div class="fields"><label>Role<input required name="role" placeholder="Software Engineer"></label><label>Company<input required name="company" placeholder="Company name"></label><label>Status<select name="status"><option>Wishlist</option><option>Applied</option><option>Interview</option><option>Offer</option></select></label><label>Applied date<input name="date" type="date"></label><label class="wide">Job link<input name="url" type="url" placeholder="https://…"></label><label class="wide">Notes<textarea name="notes" rows="2" placeholder="Contact, next steps…"></textarea></label></div><div class="form-actions"><button class="btn" type="button" id="cancel">Cancel</button><button class="btn primary">Save application</button></div></form></div><script>
const seed=[{id:'1',role:'Frontend Developer',company:'Northstar Studio',status:'Interview',date:'2026-10-18',url:'',notes:'Second conversation with the product team.'},{id:'2',role:'Software Engineer',company:'Cedar Labs',status:'Applied',date:'2026-10-20',url:'',notes:'Follow up next week.'},{id:'3',role:'Junior Backend Engineer',company:'Orbit Systems',status:'Wishlist',date:'',url:'',notes:'Check the role requirements.'},{id:'4',role:'Full-stack Developer',company:'Brightworks',status:'Offer',date:'2026-10-12',url:'',notes:'Review offer details.'}];let rows=JSON.parse(localStorage.getItem('applyboard.jobs')||'null')||seed;const stages=['Wishlist','Applied','Interview','Offer'];let editing=null;function save(){localStorage.setItem('applyboard.jobs',JSON.stringify(rows));render()}function render(){const q=document.querySelector('#search').value.toLowerCase();document.querySelector('#board').innerHTML=stages.map(s=>{const found=rows.filter(x=>x.status===s&&(x.role+' '+x.company).toLowerCase().includes(q));return `<section class="lane"><h2>${s}<span>${found.length}</span></h2>${found.length?found.map(x=>`<article class="job"><h3>${esc(x.role)}</h3><div class="company">${esc(x.company)}</div><div class="job-meta"><span class="pill">${x.date?new Date(x.date+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'No date'}</span><span class="job-actions"><button class="small" data-edit="${x.id}">Edit</button><button class="small" data-delete="${x.id}">Delete</button></span></div>${x.notes?`<div class="muted" style="margin-top:8px">${esc(x.notes)}</div>`:''}</article>`).join(''):'<div class="empty">Nothing here yet</div>'}</section>`}).join('');const active=rows.filter(x=>['Applied','Interview'].includes(x.status)).length;const interview=rows.filter(x=>x.status==='Interview').length;const responded=rows.filter(x=>['Interview','Offer'].includes(x.status)).length;document.querySelector('#total').textContent=rows.length;document.querySelector('#active').textContent=active;document.querySelector('#interviews').textContent=interview;document.querySelector('#response').textContent=rows.filter(x=>x.status!=='Wishlist').length?Math.round(responded/rows.filter(x=>x.status!=='Wishlist').length*100)+'%':'0%'}function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const modal=document.querySelector('#modal'),form=document.querySelector('#form');document.querySelector('#add').onclick=()=>{editing=null;form.reset();document.querySelector('#form-title').textContent='Add application';modal.classList.add('open')};document.querySelector('#cancel').onclick=()=>modal.classList.remove('open');document.querySelector('#search').oninput=render;document.querySelector('#reset').onclick=()=>{rows=seed.map(x=>({...x}));save()};document.querySelector('#board').onclick=e=>{const del=e.target.dataset.delete,edit=e.target.dataset.edit;if(del){rows=rows.filter(x=>x.id!==del);save()}if(edit){editing=rows.find(x=>x.id===edit);for(const [k,v]of Object.entries(editing))if(form.elements[k])form.elements[k].value=v;document.querySelector('#form-title').textContent='Edit application';modal.classList.add('open')}};form.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));if(editing)Object.assign(editing,data);else rows.unshift({id:crypto.randomUUID(),...data});modal.classList.remove('open');save()};render();
</script></body></html>
